name: Release to CurseForge

# main 에 올라온 PolestarPack_Nood.toc 의 "## Version:" 이 아직 배포되지 않은 번호이면
# 태그(v번호)를 자동으로 만들고 커스포지에 올립니다.
#   예) 1.0.0-beta → 커스포지 Beta,  1.0.0 → Release
# toc 가 없거나, 이미 배포된 번호(같은 이름의 GitHub Release 가 있음)면 아무것도 올리지 않습니다.
on:
  push:
    branches: [main]
    paths:
      - 'PolestarPack_Nood.toc'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from toc
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f PolestarPack_Nood.toc ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "no toc - nothing to do"
            exit 0
          fi
          v=$(grep -m1 '^## Version:' PolestarPack_Nood.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [ -z "$v" ] || gh release view "v$v" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v already released (or no version) - nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.ver.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.ver.outputs.tag }}"

      - name: Package and upload
        if: steps.ver.outputs.new == 'true'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # 이 작업은 브랜치 push 로 시작됐지만, 패키저가 태그 배포로 처리하도록 알려 줍니다.
          export GITHUB_REF="refs/tags/$TAG" GITHUB_REF_NAME="$TAG" GITHUB_REF_TYPE=tag
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          bash "$RUNNER_TEMP/release.sh" -n "{package-name}-{project-version}:{package-name}-{project-version}"
